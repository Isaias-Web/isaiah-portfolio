name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/portfolio-v2-audit]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Contact field validation
        run: node --experimental-strip-types --test tests/contact.test.mjs
      - name: Activity 24h window validation
        run: node --experimental-strip-types --test tests/activity-window.test.mjs
      - name: Social OG image validation
        run: node --experimental-strip-types --test tests/social-og-image.test.mjs
      - name: Production build
        run: npm run build
